services:
  db:
    image: postgres:17
    container_name: diet-db
    environment: 
      POSTGRES_USER: ${POSTGRES_USER:-diet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-diet}
      POSTGRES_DB: ${POSTGRES_DB:-diet}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-diet}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - diet-nets

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: diet-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-diet}:${POSTGRES_PASSWORD:-diet}@db:5432/${POSTGRES_DB:-diet}
      JWT_SECRET: ${JWT_SECRET:-diet-secret}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - diet-nets

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: diet-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - diet-nets

volumes:
  db_data:

networks:
  diet-nets:
    driver: bridge



